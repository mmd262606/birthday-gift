<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یک هدیه برای تو 🎁</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at top,#263344 0,#0b0e13 45%,#050609 100%);
  color:#f8efe1; display:flex; align-items:center; justify-content:center;
  padding:22px; overflow-x:hidden;
}
.card{width:min(920px,100%); text-align:center}
.cover{
  position:relative; overflow:hidden; border:1px solid #c79a55; border-radius:24px;
  background:#080b10; box-shadow:0 25px 80px #0008;
}
.cover img{display:block;width:100%;height:auto;opacity:.9}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0001 0,#0002 45%,#050609cc 100%)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:9% 7% 7%}
.kicker{letter-spacing:7px;font-size:13px;color:#e7c995;margin-bottom:5px}
h1{margin:0;font-size:clamp(42px,9vw,92px);font-family:Georgia,serif;font-style:italic;color:#e8b96e;text-shadow:0 4px 25px #000}
.date{margin:10px 0 22px;font-size:clamp(18px,3vw,27px);color:#f5d9ad}
button{
  border:1px solid #d8a861;border-radius:999px;background:#110f0b99;color:#ffe8bd;
  padding:15px 32px;font-size:18px;cursor:pointer;backdrop-filter:blur(8px);
  transition:.25s; box-shadow:0 0 25px #d6a35b33;
}
button:hover{transform:translateY(-2px);box-shadow:0 0 35px #d6a35b66}
.message{
  max-height:0; opacity:0; overflow:hidden; transition:max-height .9s ease,opacity .7s ease,margin .7s ease;
  margin:0;
}
.message.open{max-height:900px;opacity:1;margin-top:22px}
.letter{
  background:linear-gradient(145deg,#15181d,#0b0d11);border:1px solid #7f613b;
  border-radius:22px;padding:30px 24px;box-shadow:0 20px 60px #0009;
}
.letter h2{color:#e7b873;margin-top:0}
.letter p{line-height:2.1;font-size:17px;color:#eee2d0}
.signature{color:#e8b96e;font-size:20px;margin-top:22px}
.footer{font-size:12px;color:#9c927f;margin-top:18px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:600px){.content{padding:7% 5% 6%}.kicker{letter-spacing:3px}button{font-size:16px;padding:12px 25px}.letter{padding:24px 17px}.letter p{font-size:15px}}
</style>
</head>
